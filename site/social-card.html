<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/fonts.css">
  <title>Cricket 07 — Sulieman Khan Edition</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 1200px;
      height: 630px;
      background: radial-gradient(75% 90% at 80% 10%, rgba(245, 184, 46, 0.14), transparent 65%), #090b10;
      color: #f3f5f8;
      font-family: 'Plus Jakarta Sans', 'DM Sans', sans-serif;
      overflow: hidden;
    }
    .card {
      height: 100%;
      padding: 46px 58px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .top {
      display: flex;
      align-items: center;
      gap: 12px;
      font: 800 30px/1 'Barlow Condensed', sans-serif;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .top em {
      font-style: normal;
      color: #f5b82e;
    }
    .top img { width: 32px; height: 32px; }
    .edition {
      font: 600 12px/1 'JetBrains Mono', monospace;
      letter-spacing: 0.16em;
      color: #f5b82e;
      margin-left: auto;
      text-transform: uppercase;
    }
    .content {
      display: flex;
      gap: 44px;
      align-items: center;
    }
    .copy { width: 48%; }
    h1 {
      font: 800 84px/0.92 'Barlow Condensed', sans-serif;
      letter-spacing: -0.01em;
      text-transform: uppercase;
      margin: 0;
    }
    h1 span { color: #f5b82e; }
    .sub {
      font-size: 18px;
      line-height: 1.55;
      margin-top: 22px;
      color: #9ba4b5;
      max-width: 420px;
    }
    .photo {
      width: 52%;
      background: #131824;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
    }
    .photo img { width: 100%; display: block; }
    .photo p {
      color: #9ba4b5;
      margin: 0;
      padding: 12px 16px;
      font: 500 11px/1 'JetBrains Mono', monospace;
      letter-spacing: 0.12em;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      text-transform: uppercase;
    }
    .bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 20px;
      font: 500 12px/1 'JetBrains Mono', monospace;
      letter-spacing: 0.08em;
      color: #9ba4b5;
      text-transform: uppercase;
    }
    .cta {
      background: #f5b82e;
      color: #090b10;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="top">
      <img src="/assets/ball.svg" alt="">
      <span>CRICKET <em>07</em></span>
      <span class="edition">SULIEMAN KHAN EDITION</span>
    </div>
    <div class="content">
      <div class="copy">
        <h1>Classic engine.<br><span>2026</span> squads.</h1>
        <p class="sub">Play Cricket 07 directly in your browser with every 2026 international roster, all ten IPL franchises, and full WebGPU widescreen support.</p>
      </div>
      <div class="photo">
        <img src="/assets/match.webp" alt="Cricket 07 browser gameplay">
        <p>IN-ENGINE CAPTURE · IND ’26 vs CSK</p>
      </div>
    </div>
    <div class="bottom">
      <span>CURATED &amp; CUSTOMIZED BY SULIEMAN KHAN</span>
      <span class="cta">LAUNCH IN BROWSER ↗</span>
    </div>
  </div>
</body>
</html>
